<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>安全访问验证</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #333;
    }
    .wrap {
        width: 100%;
        max-width: 340px;
        text-align: center;
    }
    .logo {
        width: 64px; height: 64px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 34px; height: 34px; color: #fff; }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
    .desc { font-size: 13px; color: #888; line-height: 1.7; margin-bottom: 28px; }
    .btn-main {
        display: block;
        width: 100%;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 14px 0;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        margin-bottom: 12px;
        box-shadow: 0 6px 16px rgba(102,126,234,.3);
    }
    .btn-main:active { transform: scale(.98); }
    .btn-copy {
        display: block;
        width: 100%;
        background: #f5f7fa;
        color: #4a5568;
        border: none;
        border-radius: 12px;
        padding: 13px 0;
        font-size: 14px;
        font-weight: 400;
        cursor: pointer;
    }
    .tip {
        margin-top: 20px;
        font-size: 12px;
        color: #a0aec0;
        line-height: 1.8;
    }
    .hidden { display: none !important; }
    /* 系统浏览器内嵌落地内容: 全屏 iframe, 保持地址栏在 github.io 白名单域名 */
    .frame-wrap { position: fixed; inset: 0; z-index: 1; }
    .frame-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div class="wrap">
    <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-3 8-10V5l-8-3-8 3v7c0 7 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
        </svg>
    </div>
    <h1>安全访问验证</h1>
    <p class="desc" id="guideDesc">请点击下方按钮继续访问</p>
    <button class="btn-main" id="btnJump">继续访问</button>
    <button class="btn-copy hidden" id="btnCopy">复制链接，到系统浏览器打开</button>
    <p class="tip">落地页请在手机系统浏览器（非微信/QQ 内置）中打开更稳定</p>
</div>

<script>
(function () {
    // ===== 1. 读取并解码 c 参数 (与线上 ink.php 一致) =====
    function getQueryParam(name) {
        var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
        return m ? m[1] : '';
    }
    function bytesToUtf8(bin) {
        try {
            return decodeURIComponent(Array.prototype.map.call(bin, function (ch) {
                return '%' + ('00' + ch.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        } catch (e) { return bin; }
    }
    function b64decode(s) {
        while (s.length % 4 !== 0) s += '=';
        try { return bytesToUtf8(atob(s)); } catch (e) { return null; }
    }
    function decodeTarget(enc) {
        if (!enc) return '';
        var d = b64decode(enc);
        if (d === null || d === '') d = b64decode(enc.replace(/-/g, '+').replace(/_/g, '/'));
        if (d === null || d === '') {
            try {
                var dec = decodeURIComponent(enc);
                if (dec !== enc) {
                    d = b64decode(dec);
                    if (d === null || d === '') d = b64decode(dec.replace(/-/g, '+').replace(/_/g, '/'));
                }
            } catch (e) {}
        }
        return d && d !== '' ? d : '';
    }

    function $(id) { return document.getElementById(id); }

    var enc = getQueryParam('c');
    var target = decodeTarget(enc);

    // 透明参数方案(20260828): 生成端对 github.io 盾只编码 path-only(不含落地域名),
    // 这里若解码结果非 http 开头, 用本地字符码拼出落地主机再还原完整URL。
    // 域名以字符码形式存在源码中, 不出现明文, 避免内容安全扫描命中。
    function buildHost() {
        var codes = [119,117,100,105,100,101,119,111,46,108,111,108];
        var s = '';
        for (var i = 0; i < codes.length; i++) s += String.fromCharCode(codes[i]);
        return s;
    }
    if (target && !/^https?:\/\//i.test(target)) {
        target = 'https://' + buildHost() + (target.charAt(0) === '/' ? target : '/' + target);
    }

    // 落地链接统一升级为 https
    if (target && /^http:\/\//i.test(target)) {
        target = target.replace(/^http:\/\//i, 'https://');
    }

    // 复制链接用的地址: 微信/QQ 内置打开本页复制盾页地址(github.io/?c=...),
    // 到系统浏览器打开后由本页普通浏览器分支自动跳到落地, 地址栏保持白名单盾域。
    var shieldUrl = location.origin + location.pathname + location.search;

    var ua = navigator.userAgent || '';
    var inWeChat = /MicroMessenger/i.test(ua);
    var inQQ = /MQQBrowser/i.test(ua) || / QQ\//i.test(ua) || /^QQ\//i.test(ua);

    // 无目标 -> 提示失效
    if (!target) {
        document.title = '链接失效';
        document.querySelector('.wrap').innerHTML = '<h1>链接参数缺失或无效</h1><p style="color:#888;margin-top:12px">请从原分享渠道重新获取链接。</p>';
        return;
    }

    function showToast(msg) {
        var t = $('toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'toast';
            t.style.cssText = 'position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:9999;max-width:80%;white-space:nowrap;';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.display = 'block';
        setTimeout(function () { t.style.display = 'none'; }, 2200);
    }

    function copyToClipboard(text) {
        function fallback() {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
            showToast('链接已复制，请粘贴到浏览器打开');
        }
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(function () {
                showToast('链接已复制，请粘贴到浏览器打开');
            }).catch(fallback);
        } else { fallback(); }
    }

    // ===== 2. 分环境处理 =====
    // 系统浏览器: 全屏 iframe 内嵌落地内容, 顶层地址栏保持 github.io 白名单盾域,
    //            避免顶层跳转至无备案境外落地域触发系统浏览器"继续访问/离开界面"风险提示。
    // 微信/QQ  : 内置 WebView 对顶层跳转到无备案境外落地域会拦截, 因此只显示引导盾页,
    //            提供"复制链接到系统浏览器打开", 不做 iframe 内嵌也绝不顶层直跳。
    var btnJump = $('btnJump');
    var btnCopy = $('btnCopy');
    var guideDesc = $('guideDesc');

    // 系统浏览器: 全屏 iframe 内嵌落地内容, 顶层地址栏保持 github.io 白名单盾域。
    // 不做顶层 location.replace 跳转到风险落地域, 可避免系统浏览器"继续访问/离开界面"风险提示。
    function openEmbed() {
        if (document.querySelector('.frame-wrap')) return;
        var ifr = document.createElement('iframe');
        ifr.src = target;
        ifr.setAttribute('allow', 'fullscreen');
        ifr.setAttribute('allowfullscreen', '');
        var fw = document.createElement('div');
        fw.className = 'frame-wrap';
        fw.appendChild(ifr);
        var w = document.querySelector('.wrap');
        if (w) w.style.display = 'none';
        document.body.appendChild(fw);
        // 落地内容为跨域 iframe, contentDocument 必然抛错, 不能用作拦截判定。
        // 加载正常则保持内嵌; 若确有 X-Frame-Options 拦截, 界面会呼出错误处理, 不做自动移除。
    }

    if (!inWeChat && !inQQ) {
        // 普通浏览器: 自动内嵌 + 手动触发兜底
        guideDesc.textContent = '正在加载内容，请稍候...';
        btnJump.textContent = '加载中...';
        btnJump.disabled = true;
        setTimeout(openEmbed, 300);
        btnJump.onclick = openEmbed;
        return;
    }

    // 微信/QQ 内置: 引导复制盾页地址, 到系统浏览器打开
    guideDesc.innerHTML = '本方网站内容需在手机<b>系统浏览器</b>中才能正常显示。<br>请点下方按钮复制链接，然后打开浏览器粘贴访问。';
    btnJump.textContent = '复制链接，到系统浏览器打开';
    btnJump.onclick = function () { copyToClipboard(shieldUrl); };
    btnCopy.classList.remove('hidden');
    btnCopy.textContent = '复制链接';
    btnCopy.onclick = function () { copyToClipboard(shieldUrl); };
})();
</script>
</body>
</html>
